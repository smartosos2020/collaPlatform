spring:
  datasource:
    url: jdbc:tc:postgresql:16:///colla_platform_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate

colla:
  runtime:
    role: ${COLLA_RUNTIME_ROLE:combined}
  realtime:
    channel: ${COLLA_REALTIME_CHANNEL:colla:test:realtime:v1}
    redis-listener-enabled: false
    send-threads: 2
    executor-queue-capacity: 32
    session-queue-capacity: 8
