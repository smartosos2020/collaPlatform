spring:
  datasource:
    url: jdbc:tc:postgresql:16:///colla_platform_test?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate

colla:
  runtime:
    role: ${COLLA_RUNTIME_ROLE:combined}
  realtime:
    channel: ${COLLA_REALTIME_CHANNEL:colla:test:realtime:v1}
    redis-listener-enabled: false
    send-threads: 2
    executor-queue-capacity: 32
    session-queue-capacity: 8
  project-space-experience:
    enabled: true
    kill-switch: false
    rollout-basis-points: 10000
    evaluation-salt: s21-m7-test-rollout
    telemetry:
      enabled: true
      sample-basis-points: 10000
      max-batch-size: 20
